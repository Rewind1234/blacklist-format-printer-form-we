<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blacklist Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #11141a;
      color: #e6edf3;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 820px;
      width: 100%;
      background: #181d26;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 28px;
    }
    h1 {
      font-size: 1.4rem;
      color: #58a6ff;
      margin-bottom: 6px;
    }
    p.sub {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .full-width {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #c9d1d9;
    }
    input, textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      color: #f0f6fc;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88,166,255,0.2);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2ea043;
    }
    button.copy-btn {
      background: #30363d;
    }
    button.copy-btn:hover {
      background: #3c444d;
    }
    .output-section {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .output-header span {
      font-weight: 600;
      color: #8b949e;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    pre {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 14px;
      color: #e6edf3;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>## Blacklist Template Generator</h1>
  <p class="sub">Fill out the fields below to live-format your completed blacklist report ready for Discord.</p>

  <div class="form-grid">
    <div>
      <label for="date">## Report Date</label>
      <input type="text" id="date" value="" placeholder="YYYY-MM-DD or today's date" />
    </div>

    <div>
      <label for="name">## Name / Accused User</label>
      <input type="text" id="name" placeholder="User tag or known alias" />
    </div>

    <div class="full-width">
      <label for="desc">## Description of Incident</label>
      <textarea id="desc" placeholder="Details of the violation, server rules broken, etc."></textarea>
    </div>

    <div class="full-width">
      <label for="drive">## Proof (Google Drive Link)</label>
      <input type="url" id="drive" placeholder="https://drive.google.com/..." />
    </div>

    <div class="full-width">
      <label for="vrchat">## VRChat Profile Link</label>
      <input type="url" id="vrchat" placeholder="https://vrchat.com/home/user/usr_..." />
    </div>

    <div>
      <label for="discordUser">## Discord Username (Not Display Name)</label>
      <input type="text" id="discordUser" placeholder="e.g. username" />
    </div>

    <div>
      <label for="discordId">## Discord ID (Numerical)</label>
      <input type="text" id="discordId" placeholder="e.g. 123456789012345678" />
    </div>
  </div>

  <div class="btn-row">
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy Formatted Output</button>
  </div>

  <div class="output-section">
    <div class="output-header">
      <span>Generated Discord Output</span>
      <span id="copyNotice" style="color: #3fb950; font-size: 0.8rem; display: none;">Copied!</span>
    </div>
    <pre id="output"></pre>
  </div>
</div>

<script>
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('date').value = today;

  const inputs = ['date', 'name', 'desc', 'drive', 'vrchat', 'discordUser', 'discordId'];
  
  function updateTemplate() {
    const d = document.getElementById('date').value || today;
    const name = document.getElementById('name').value || '[NAME]';
    const desc = document.getElementById('desc').value || '[DESCRIPTION]';
    const drive = document.getElementById('drive').value || '[GOOGLE DRIVE LINK]';
    const vrchat = document.getElementById('vrchat').value || '[VRCHAT LINK]';
    const discUser = document.getElementById('discordUser').value || '[DISCORD USERNAME]';
    const discId = document.getElementById('discordId').value || '[DISCORD ID]';

    const formatted = 
`## NEW UPDATED BLACKLIST
(${d})
 
## BY աɨȶƈɦ ɛʏɛֆ BLACKLIST SERVER
(${name})
## • DESCRIPTION
${desc}

## •PROOF•
GOOGLE DRIVE
${drive}

## VRCHAT
• ${vrchat}

## DISCORD
• ${discUser}

## DISCORD ID
• ${discId}`;

    document.getElementById('output').textContent = formatted;
  }

  inputs.forEach(id => {
    document.getElementById(id).addEventListener('input', updateTemplate);
  });

  updateTemplate();

  function copyOutput() {
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const notice = document.getElementById('copyNotice');
      notice.style.display = 'inline';
      setTimeout(() => { notice.style.display = 'none'; }, 2000);
    });
  }
</script>
/*test*/
</body>
</html>
